# Builds the walk data from open data and publishes the site to GitHub Pages.
# Runs after every change (e.g. a save in the editor), every Monday, and on demand (Actions → Run workflow).
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC: refresh texts and positions from open data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # The build stops starting new work after BUILD_BUDGET_MIN and sends no requests after 5 more minutes,
    # so it finishes well within this limit even when the open data services are slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the build script
        run: node --test
      # OpenStreetMap data for Belgium from Geofabrik, fetched at most once a day: the build answers its
      # OpenStreetMap questions from it instead of the busy public Overpass servers.
      # If any of this fails, the build simply asks the public Overpass servers, as before.
      - name: Note today's date
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore today's OpenStreetMap extract
        id: osm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/osm-belgium.geojsonseq
            .cache/osm-belgium.poly
          key: osm-belgium-${{ steps.day.outputs.day }}
      - name: Download and filter OpenStreetMap data for Belgium (Geofabrik)
        if: steps.osm.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          UA: "CityWalks/1.0 (https://github.com/${{ github.repository }}; walk data build)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends osmium-tool
          curl -fsSL --retry 3 -A "$UA" -o "$RUNNER_TEMP/belgium.osm.pbf" https://download.geofabrik.de/europe/belgium-latest.osm.pbf
          osmium tags-filter -O -o "$RUNNER_TEMP/wanted.osm.pbf" "$RUNNER_TEMP/belgium.osm.pbf" nwr/tourism=artwork nwr/wikipedia nwr/wikidata
          osmium export -O -f geojsonseq -x print_record_separator=false --attributes=type,id -o "$RUNNER_TEMP/all.geojsonseq" "$RUNNER_TEMP/wanted.osm.pbf"
          # osmium also writes the objects it needed for geometry; keep only the ones the build asks about
          grep -E '"(wikipedia|wikidata)":|"tourism":"artwork"' "$RUNNER_TEMP/all.geojsonseq" > "$RUNNER_TEMP/osm.geojsonseq"
          # the extract's boundary: only questions about places inside it are answered from the extract
          curl -fsSL --retry 3 -A "$UA" -o "$RUNNER_TEMP/osm.poly" https://download.geofabrik.de/europe/belgium.poly
          mkdir -p .cache
          mv "$RUNNER_TEMP/osm.poly" .cache/osm-belgium.poly
          mv "$RUNNER_TEMP/osm.geojsonseq" .cache/osm-belgium.geojsonseq
          ls -l .cache/osm-belgium.*
      - name: Save today's OpenStreetMap extract
        if: ${{ steps.osm.outputs.cache-hit != 'true' && hashFiles('.cache/osm-belgium.geojsonseq') != '' && hashFiles('.cache/osm-belgium.poly') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/osm-belgium.geojsonseq
            .cache/osm-belgium.poly
          key: osm-belgium-${{ steps.day.outputs.day }}
      # Answers from the open data services are kept between runs, so a run after an edit
      # doesn't have to ask Wikipedia, OpenStreetMap etc. everything again.
      - name: Restore saved open data answers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/http-cache.json
          key: open-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: open-data-
      - name: Build walk data
        run: node --version && node build.mjs
        env:
          BUILD_MODE: ${{ github.event_name == 'push' && 'incremental' || 'full' }}
          BUILD_BUDGET_MIN: "20"
          HTTP_CACHE: .cache/http-cache.json
          OSM_EXTRACT: .cache/osm-belgium.geojsonseq
          OSM_BOUNDARY: .cache/osm-belgium.poly
          # After an edit: reuse answers up to 8 days old. Mondays and manual runs: ask everything fresh.
          HTTP_CACHE_MAX_AGE_MIN: ${{ github.event_name == 'push' && '11520' || '0' }}
      - name: Save open data answers for the next run
        if: ${{ !cancelled() && hashFiles('.cache/http-cache.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/http-cache.json
          key: open-data-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
